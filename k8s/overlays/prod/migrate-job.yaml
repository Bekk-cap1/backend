apiVersion: batch/v1
kind: Job
metadata:
  name: intercity-migrate
  namespace: intercity
  labels:
    app: intercity-migrate
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: intercity-migrate
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      restartPolicy: Never
      containers:
        - name: intercity-migrate
          image: intercity-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/migrate-with-lock.js"]
          envFrom:
            - configMapRef:
                name: intercity-config
            - secretRef:
                name: intercity-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
