apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intercity-backend
  namespace: intercity
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - host: intercity.example.com
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: intercity-backend
                port:
                  number: 80
