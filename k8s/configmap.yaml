apiVersion: v1
kind: ConfigMap
metadata:
  name: intercity-config
  namespace: intercity
data:
  NODE_ENV: production
  PORT: "3000"
  API_PREFIX: api
  LOG_LEVEL: info
  CORS_ORIGIN: https://example.com
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX: "200"
  RATE_LIMIT_AUTH_MAX: "20"
  SWAGGER_ENABLED: "false"
  REALTIME_ENABLED: "true"
  METRICS_ENABLED: "true"
  BULL_PREFIX: intercity
  BOOKING_CANCEL_FEE_PERCENT: "10"
  OFFERS_MAX_DRIVER: "3"
  OFFERS_MAX_PASSENGER: "3"
