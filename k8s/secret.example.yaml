apiVersion: v1
kind: Secret
metadata:
  name: intercity-secrets
  namespace: intercity
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:password@host:5432/intercity?schema=public
  SHADOW_DATABASE_URL: postgresql://user:password@host:5432/intercity_shadow?schema=public
  REDIS_URL: redis://:password@host:6379
  JWT_ACCESS_SECRET: CHANGE_ME_ACCESS_SECRET_32CHARS
  JWT_REFRESH_SECRET: CHANGE_ME_REFRESH_SECRET_32CHARS
  JWT_ACCESS_TTL: "900"
  JWT_REFRESH_TTL: "2592000"
  SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
  SENTRY_ENV: production
  SENTRY_RELEASE: intercity@0.0.1
