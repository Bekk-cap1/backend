name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check forbidden files
        run: node scripts/check-forbidden-files.js --all

  build-test:
    needs: no-binaries
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intercity_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intercity_shadow?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_123456
      JWT_REFRESH_SECRET: ci_refresh_secret_123456
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 2592000

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE intercity_test;' || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE intercity_shadow;' || true

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:cov

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Generate OpenAPI
        run: npm run openapi:generate

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      GHCR_OWNER: ${{ toLower(github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/intercity-backend:${{ github.sha }}
            ghcr.io/${{ env.GHCR_OWNER }}/intercity-backend:latest

          labels: |
            org.opencontainers.image.source=${{ github.repository }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      GHCR_OWNER: ${{ toLower(github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Run migrations job
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/intercity-backend:${{ github.sha }}

          NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NAMESPACE="${NAMESPACE:-intercity}"
          kubectl -n "${NAMESPACE}" delete job intercity-migrate --ignore-not-found
          kubectl apply -f k8s/migrate-job.yaml
          kubectl -n "${NAMESPACE}" set image job/intercity-migrate intercity-migrate="${IMAGE}"
          kubectl -n "${NAMESPACE}" wait --for=condition=complete job/intercity-migrate --timeout=180s

      - name: Deploy manifests
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/intercity-backend:${{ github.sha }}

          NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          NAMESPACE="${NAMESPACE:-intercity}"
          kubectl apply -k k8s
          kubectl -n "${NAMESPACE}" set image deployment/intercity-backend intercity-backend="${IMAGE}"
          kubectl -n "${NAMESPACE}" rollout status deployment/intercity-backend --timeout=180s
