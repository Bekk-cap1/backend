name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check forbidden files
        run: node scripts/check-forbidden-files.js --all

  build-test:
    needs: no-binaries
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test

      # Required early (postinstall -> prisma generate)
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intercity_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intercity_shadow?schema=public
      REDIS_URL: redis://localhost:6379

      # For tests (some code uses *_TEST)
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/intercity_test?schema=public
      SHADOW_DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/intercity_shadow?schema=public
      REDIS_URL_TEST: redis://localhost:6379

      JWT_ACCESS_SECRET: ci_access_secret_123456
      JWT_REFRESH_SECRET: ci_refresh_secret_123456
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_TTL: "2592000"
      JWT_SECRET: test_jwt_secret

      # MUST be non-empty because env validation rejects empty string
      SENTRY_DSN: "https://public@example.ingest.sentry.io/1"

      METRICS_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tools (psql + redis-cli)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools

      - name: Wait for services
        shell: bash
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U postgres && break
            sleep 2
          done
          pg_isready -h localhost -U postgres || exit 1

          for i in {1..30}; do
            redis-cli -h localhost ping >/dev/null 2>&1 && break
            sleep 2
          done
          redis-cli -h localhost ping >/dev/null 2>&1 || exit 1

      - name: Prepare databases
        shell: bash
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE intercity_test;' || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE intercity_shadow;' || true

      - name: Install dependencies
        # Ensure DATABASE_URL exists at install time for prisma generate in postinstall
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?schema=public
          JWT_SECRET: test_jwt_secret
          SENTRY_DSN: "https://public@example.ingest.sentry.io/1"
          METRICS_ENABLED: "true"
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma migrate
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests (coverage)
        run: npm run test:cov

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Generate OpenAPI
        run: npm run openapi:generate

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute GHCR owner lowercase
        shell: bash
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.GHCR_OWNER }}/${{ github.event.repository.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build and push image (latest)
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.GHCR_OWNER }}/${{ github.event.repository.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy config
        id: deploy_check
        shell: bash
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy (no KUBE_CONFIG)
        if: steps.deploy_check.outputs.enabled != 'true'
        run: echo "KUBE_CONFIG not set -> skipping deploy"

      - name: Compute GHCR owner lowercase
        if: steps.deploy_check.outputs.enabled == 'true'
        shell: bash
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Configure kubeconfig
        if: steps.deploy_check.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Run migrations job
        if: steps.deploy_check.outputs.enabled == 'true'
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/${{ github.event.repository.name }}:sha-${{ github.sha }}
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        shell: bash
        run: |
          NAMESPACE="${NAMESPACE:-intercity}"
          kubectl -n "${NAMESPACE}" delete job intercity-migrate --ignore-not-found
          kubectl apply -f k8s/migrate-job.yaml
          kubectl -n "${NAMESPACE}" set image job/intercity-migrate intercity-migrate="${IMAGE}"
          kubectl -n "${NAMESPACE}" wait --for=condition=complete job/intercity-migrate --timeout=180s

      - name: Deploy manifests
        if: steps.deploy_check.outputs.enabled == 'true'
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/${{ github.event.repository.name }}:sha-${{ github.sha }}
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        shell: bash
        run: |
          NAMESPACE="${NAMESPACE:-intercity}"
          kubectl apply -k k8s
          kubectl -n "${NAMESPACE}" set image deployment/intercity-backend intercity-backend="${IMAGE}"
          kubectl -n "${NAMESPACE}" rollout status deployment/intercity-backend --timeout=180s
