name: Self Verification

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify_unit_openapi:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Generate OpenAPI
        run: npm run openapi:generate
      - name: Unit tests with coverage
        run: npm run test:cov | tee coverage-summary.txt
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json
      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt

  verify_e2e_services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intercity_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intercity_shadow?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/intercity_test?schema=public
      SHADOW_DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/intercity_shadow?schema=public
      REDIS_URL_TEST: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_123456
      JWT_REFRESH_SECRET: ci_refresh_secret_123456
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 2592000
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Prepare databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE intercity_test;' || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE intercity_shadow;' || true
      - name: Prisma migrate
        run: npx prisma migrate deploy
      - name: Run e2e 3x
        run: |
          set -e
          : > e2e-log.txt
          for i in 1 2 3; do
            echo "E2E run ${i}" | tee -a e2e-log.txt
            npm run test:e2e 2>&1 | tee -a e2e-log.txt
          done
      - name: Upload e2e log
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e-log.txt

  verify_health_metrics_smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intercity_smoke?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intercity_smoke_shadow?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_123456
      JWT_REFRESH_SECRET: ci_refresh_secret_123456
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 2592000
      METRICS_ENABLED: true
      SWAGGER_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Prepare databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE intercity_smoke;' || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE intercity_smoke_shadow;' || true
      - name: Prisma migrate
        run: npx prisma migrate deploy
      - name: Build
        run: npm run build
      - name: Start app
        run: |
          nohup node dist/main > app.log 2>&1 &
          echo $! > app.pid
          sleep 5
      - name: Smoke health/metrics
        run: |
          set -e
          curl -sSf http://localhost:3000/health/live | tee health-live.json
          curl -sSf http://localhost:3000/health/ready | tee health-ready.json
          curl -sSf http://localhost:3000/metrics | tee metrics.txt
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: health-metrics
          path: |
            health-live.json
            health-ready.json
            metrics.txt
      - name: Upload app log
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
